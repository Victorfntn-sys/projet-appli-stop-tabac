services:
  - type: web
    name: calculateur-economies-tabac
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.15.0
      - key: VAPID_SUBJECT
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: TWA_PACKAGE_NAME
        sync: false
      - key: TWA_SHA256_CERT_FINGERPRINTS
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: EXPORT_ADMIN_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: FEEDBACK_WEBHOOK_URL
        sync: false
