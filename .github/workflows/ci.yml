name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      VAPID_SUBJECT: mailto:ci@example.com
      VAPID_PUBLIC_KEY: ci-public-key-placeholder
      VAPID_PRIVATE_KEY: ci-private-key-placeholder
      ADMIN_API_KEY: ci-admin-key
      EXPORT_ADMIN_KEY: ci-export-key
      TWA_PACKAGE_NAME: com.example.ci
      TWA_SHA256_CERT_FINGERPRINTS: AA:BB:CC:DD
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security checks
        run: npm run check:security
